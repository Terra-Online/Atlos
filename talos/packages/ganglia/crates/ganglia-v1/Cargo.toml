[package]
name = "ganglia-v1"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
napi = { version = "3", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "3", optional = true }

[build-dependencies]
napi-build = { version = "2", optional = true }

[profile.release]
lto = "thin"

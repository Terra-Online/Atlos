<section
  id="ganglia-viewer"
  aria-label="Ganglia 骨干查看器"
>
  <style>
    #ganglia-viewer {
      --scene: var(--card, #15202b);
      --ink: var(--foreground, #e6edf5);
      --dim: var(--muted-foreground, #9cabb8);
      --stroke: var(--border, #354453);
      --start: var(--blue, var(--info, #58b5f7));
      --goal: var(--green, var(--success, #55d6ab));
      --path: var(--orange, var(--warning, #f5b95e));
      --barrier: var(--red, var(--destructive, #f17d88));
      color: var(--ink);
      display: grid;
      gap: 10px;
    }
    #ganglia-viewer .toolbar,
    #ganglia-viewer .layers,
    #ganglia-viewer .legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 13px;
    }
    #ganglia-viewer .layers {
      justify-content: space-between;
    }
    #ganglia-viewer .layers label {
      white-space: nowrap;
    }
    #ganglia-viewer label,
    #ganglia-viewer .legend,
    #ganglia-viewer .detail {
      color: var(--dim);
    }
    #ganglia-viewer nav {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    #ganglia-viewer button {
      font: inherit;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--stroke);
      border-radius: 6px;
      padding: 4px 9px;
      cursor: pointer;
    }
    #ganglia-viewer button[aria-pressed='true'] {
      background: var(--secondary, #2a3c4e);
      color: var(--secondary-foreground, var(--ink));
    }
    #ganglia-viewer [hidden] {
      display: none;
    }
    #ganglia-viewer canvas {
      display: block;
      width: 100%;
      height: 408px;
      background: var(--scene);
      border-radius: 8px;
    }
    #ganglia-viewer canvas.is-3d {
      cursor: grab;
      touch-action: none;
    }
    #ganglia-viewer canvas.is-3d:active {
      cursor: grabbing;
    }
    #ganglia-viewer .legend span:not([hidden]) {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    #ganglia-viewer .key {
      width: 9px;
      height: 9px;
      border-radius: 2px;
      background: currentColor;
    }
    #ganglia-viewer .detail {
      margin: 0;
    }
    #ganglia-viewer .timing {
      color: var(--dim);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 520px) {
      #ganglia-viewer canvas {
        height: 340px;
      }
    }
  </style>

  <div class="toolbar">
    <strong data-title></strong>
    <nav aria-label="视角"></nav>
  </div>
  <canvas
    role="img"
    aria-label="固定走廊与三维碰撞白模"
  ></canvas>
  <div class="layers">
    <div
      class="toolbar"
      data-layers
    >
      <label
        ><input
          type="checkbox"
          data-layer="mesh"
          checked
        />
        白模</label
      >
      <label
        ><input
          type="checkbox"
          data-layer="graph"
          checked
        />
        骨干</label
      >
      <label title="同一强连通分量使用同一种颜色，颜色可重复"
        ><input
          type="checkbox"
          data-layer="components"
          checked
        />
        分量着色</label
      >
      <label
        ><input
          type="checkbox"
          data-layer="trace"
          checked
        />
        轨迹 / 断点</label
      >
      <label
        ><input
          type="checkbox"
          data-hide-occluded
        />
        隐藏遮挡</label
      >
      <button
        type="button"
        data-top
        aria-pressed="false"
      >
        俯视
      </button>
      <small>拖动旋转 · 滚轮缩放 · WASD 平移 · Q/E 进退</small>
    </div>
    <div
      class="legend"
      aria-label="图例"
    >
      <span data-reachability
        ><i
          class="key"
          style="color: var(--start)"
        ></i
        >起点可达</span
      >
      <span data-reachability
        ><i
          class="key"
          style="color: var(--goal)"
        ></i
        >可到目标</span
      >
      <span
        ><i
          class="key"
          style="color: var(--path)"
        ></i
        >实测轨迹</span
      >
      <span
        ><i
          class="key"
          style="color: var(--barrier)"
        ></i
        >碰撞阻挡</span
      >
    </div>
  </div>
  <p
    class="detail"
    aria-live="polite"
  ></p>
  <output
    class="timing"
    data-render-timing
    aria-live="off"
    title="CPU 重绘耗时。移动 p95 取最近最多 60 帧，白模耗时包含深度与勾边。"
  ></output>
</section>
<script
  type="application/json"
  id="ganglia-viewer-data"
>
  /* SCENE_DATA */
</script>
<script>
  (() => {
    /* CANVAS_RENDERER */
    const data = JSON.parse(document.getElementById('ganglia-viewer-data').textContent);
    const root = document.getElementById('ganglia-viewer');
    const canvas = root.querySelector('canvas');
    const renderer = createRenderer(canvas, {
      viewport: { width: 0, height: 0, pixelRatio: 1 },
      camera: { center: [0, 0, 0], yaw: 0, pitch: 0, distance: 1, focalLength: 1 },
    });
    const { camera, viewport } = renderer.state;
    const detail = root.querySelector('.detail');
    const layers = root.querySelector('[data-layers]');
    const topButton = root.querySelector('[data-top]');
    const timingOutput = root.querySelector('[data-render-timing]');
    const motionSamples = [];
    let lastTimingUpdate = -Infinity;
    let wheelTimer;
    const settings = { mesh: true, graph: true, components: true, trace: true };
    const componentToggle = root.querySelector('[data-layer="components"]');
    const reachabilityLegend = root.querySelectorAll('[data-reachability]');
    const componentPalette = [
      '#ba647a',
      '#c17c48',
      '#b29447',
      '#829c4d',
      '#4b9771',
      '#4b9695',
      '#5588af',
      '#6b73b4',
      '#9568aa',
      '#ac658e',
    ];
    const views = data.coverage ? [null, ...data.views] : data.views;
    const movementKeys = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE']);
    const heldKeys = new Set();
    let selected = 0,
      initialArmLength,
      topView,
      pointer,
      previousFrame,
      pending = false;
    let width, height, colors, sceneObjects;
    const fallbackAngle = [-0.7, 0.68];
    const coverage = data.coverage;
    root.querySelector('[data-title]').textContent = data.title;

    for (const view of data.views) {
      view.mesh = {
        kind: 'mesh',
        faces: view.triangles,
        clip: { min: view.min, max: view.max },
        material: { kind: 'contour', color: [210, 216, 222], outline: [80, 92, 106] },
      };
      view.componentColors = view.nodes.map(([, , component]) => {
        if (component === null) return null;
        const hash = Math.imul(component + 1, 0x9e3779b1);
        return componentPalette[((hash ^ (hash >>> 16)) >>> 0) % componentPalette.length];
      });
      view.hasComponents = view.componentColors.some(Boolean);
    }
    const buttons = views.map((view, i) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = view
        ? (view.title ?? `窗口 ${data.views.indexOf(view) + 1}`)
        : '走廊总览';
      button.addEventListener('click', () => {
        select(i);
        if (view) canvas.focus({ preventScroll: true });
      });
      root.querySelector('nav').append(button);
      return button;
    });

    function select(index) {
      selected = index;
      const view = views[index];
      [camera.yaw, camera.pitch] = view?.angle ?? fallbackAngle;
      camera.center = [0, 0, 0];
      sceneObjects = undefined;
      motionSamples.length = 0;
      lastTimingUpdate = -Infinity;
      initialArmLength = view
        ? Math.hypot(...view.max.map((value, axis) => value - view.min[axis])) || 1
        : 1;
      camera.distance = initialArmLength;
      stopMoving();
      topView = false;
      topButton.setAttribute('aria-pressed', 'false');
      buttons.forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
      layers.hidden = !view;
      timingOutput.hidden = !view;
      canvas.classList.toggle('is-3d', Boolean(view));
      canvas.tabIndex = view ? 0 : -1;
      canvas.setAttribute('aria-label', buttons[index].textContent);
      updateColorControls();
      detail.textContent = view
        ? (view.detail ?? `${view.nodes.length} 节点 · ${view.edges.length} 条有向边`)
        : (data.overview ?? `${coverage.tiles.length} 个 tile · 每个 tile ${coverage.span} 米`);
      schedule();
    }

    function updateColorControls() {
      const hasComponents = Boolean(views[selected]?.hasComponents);
      componentToggle.disabled = !hasComponents;
      for (const entry of reachabilityLegend) entry.hidden = hasComponents && settings.components;
    }

    function color(name) {
      const probe = document.createElement('span');
      probe.style.color = `var(--${name})`;
      root.append(probe);
      const value = getComputedStyle(probe).color;
      probe.remove();
      return value;
    }

    function schedule() {
      if (pending) return;
      pending = true;
      requestAnimationFrame((now) => {
        pending = false;
        const elapsed =
          previousFrame === undefined
            ? 0
            : Math.max(0, Math.min((now - previousFrame) / 1000, 0.05));
        previousFrame = heldKeys.size ? now : undefined;
        paint(elapsed);
        if (heldKeys.size) schedule();
      });
    }

    function paint(elapsed) {
      const started = performance.now();
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      if (!width || !height) return;
      Object.assign(viewport, { width, height, pixelRatio: Math.min(devicePixelRatio || 1, 2) });
      const nextColors = Object.fromEntries(
        ['scene', 'ink', 'dim', 'stroke', 'start', 'goal', 'path', 'barrier'].map((name) => [
          name,
          color(name),
        ]),
      );
      if (Object.keys(nextColors).some((name) => nextColors[name] !== colors?.[name])) {
        colors = nextColors;
        sceneObjects = undefined;
      }
      const view = views[selected];
      if (view) {
        const moving = Boolean(pointer || heldKeys.size || wheelTimer);
        renderer.state.contourSamples = moving ? 1 : 2;
        const { contourMs } = drawScene(view, elapsed);
        recordTiming(started, contourMs, moving);
      } else {
        renderer.render(mapObjects());
      }
    }

    function recordTiming(started, contourMs, moving) {
      const now = performance.now();
      const totalMs = now - started;
      if (moving) {
        motionSamples.push([totalMs, contourMs]);
        if (motionSamples.length > 60) motionSamples.shift();
        if (now - lastTimingUpdate < 250) return;
      }
      lastTimingUpdate = now;
      const p95 = (index) =>
        motionSamples
          .map((row) => row[index])
          .sort((a, b) => a - b)
          [Math.ceil(motionSamples.length * 0.95) - 1].toFixed(1);
      const motion = motionSamples.length
        ? `移动 p95 ${p95(0)} ms · 白模 p95 ${p95(1)} ms（${motionSamples.length} 帧）`
        : '';
      const still = `静止重绘 ${totalMs.toFixed(1)} ms`;
      timingOutput.value = moving ? motion : [motion, still].filter(Boolean).join(' · ');
    }

    const stroke = (points, color, width = 1) => ({
      kind: 'line',
      points,
      stroke: { color, width },
    });
    const marker = (at, text, color, align) => ({
      kind: 'label',
      at,
      text,
      color: colors.ink,
      halo: colors.scene,
      marker: { color, align },
    });
    const caption = (x, y, text) => ({
      kind: 'label',
      space: 'screen',
      at: [x, y, 0],
      text,
      color: colors.dim,
    });

    function scaleBar(scale, meters) {
      const x = 13;
      const y = height - 16;
      const end = x + scale * meters;
      return [
        {
          ...stroke(
            [
              [x, y - 8, 0],
              [x, y, 0],
              [end, y, 0],
              [end, y - 8, 0],
            ],
            colors.dim,
          ),
          space: 'screen',
        },
        caption(end + 6, y, `${meters} m`),
      ];
    }

    function mapObjects() {
      const { tiles, span } = coverage;
      if (!tiles.length) return [];
      const x0 = Math.min(...tiles.map((t) => t[0])),
        x1 = Math.max(...tiles.map((t) => t[0])) + 1;
      const z0 = Math.min(...tiles.map((t) => t[1])),
        z1 = Math.max(...tiles.map((t) => t[1])) + 1;
      const scale = Math.min((width - 42) / (x1 - x0), (height - 48) / (z1 - z0));
      const plot = (x, z) => [
        width / 2 + (x - (x0 + x1) / 2) * scale,
        height / 2 + (z - (z0 + z1) / 2) * scale,
        0,
      ];
      const at = (p) => plot(p[0] / span, p[2] / span);
      const objects = [];
      const screen = (object) => ({ ...object, space: 'screen' });
      function tile(x, z, size, color, opacity) {
        const [px, py] = plot(x, z);
        const w = Math.max(1, scale * size - 0.9);
        const h = Math.max(1, scale - 0.9);
        objects.push(
          screen({
            kind: 'mesh',
            faces: [
              [
                [px, py, 0],
                [px + w, py, 0],
                [px + w, py + h, 0],
                [px, py + h, 0],
              ],
            ],
            material: { kind: 'flat', color, opacity },
          }),
        );
      }
      for (const [x, z, total, start, goal] of tiles) {
        tile(
          x,
          z,
          1,
          start ? colors.start : goal ? colors.goal : colors.dim,
          start || goal ? 0.85 : total ? 0.38 : 0.15,
        );
        if (start && goal) tile(x + 0.5, z, 0.5, colors.goal, 0.85);
      }
      for (const route of data.route)
        objects.push(screen(stroke(route.points.map(at), colors.path, 2)));
      if (data.start) objects.push(screen(marker(at(data.start), '起点', colors.start, 'right')));
      objects.push(screen(marker(at(data.goal), '目标', colors.goal)));
      for (const [i, view] of data.views.entries()) {
        objects.push(
          screen(
            marker(
              at(view.center),
              view.title ?? `窗口 ${i + 1}`,
              colors.path,
              i === 0 ? 'right' : 'left',
            ),
          ),
        );
      }
      return [
        ...objects,
        ...scaleBar(scale / span, 250),
        caption(width - 64, height - 16, 'XZ 俯视'),
      ];
    }

    function changeArmLength(factor) {
      camera.distance = Math.max(
        initialArmLength / 4,
        Math.min(initialArmLength / 0.65, camera.distance * factor),
      );
    }

    function drawScene(view, elapsed) {
      const frame = renderer.frame();
      const extent = (axis) =>
        axis.reduce(
          (sum, value, i) =>
            sum + Math.abs(value) * 2 * Math.max(Math.abs(view.min[i]), Math.abs(view.max[i])),
          0,
        );
      const fit = Math.min((width - 42) / extent(frame.right), (height - 43) / extent(frame.up));
      camera.focalLength = fit * initialArmLength;
      const pressed = (key) => Number(heldKeys.has(key));
      const dolly = pressed('KeyE') - pressed('KeyQ');
      if (dolly) changeArmLength(Math.exp(dolly * 1.4 * elapsed));
      const scale = renderer.frame().scale;
      const right = pressed('KeyD') - pressed('KeyA');
      const up = pressed('KeyW') - pressed('KeyS');
      if (right || up) {
        // Move the orbit center along the current image plane.
        const step = (220 * elapsed) / (scale * Math.hypot(right, up));
        camera.center = camera.center.map(
          (value, axis) => value + step * (right * frame.right[axis] + up * frame.up[axis]),
        );
      }
      sceneObjects ??= localObjects(view);
      const hud = scaleBar(scale, scale > 50 ? 1 : 5);
      if (topView) hud.push(caption(width - 64, height - 16, 'XZ 俯视'));
      return renderer.render([...sceneObjects, ...hud]);
    }

    const actionNames = { walk: '行走', jump: '跳跃', drop: '下落', rope: '攀绳', launch: '发射' };
    const gaitNames = { run: '跑步', sprint: '冲刺', dash: '闪避' };

    function traceObjects(trace) {
      const lines = [],
        labels = [],
        endpoints = new Map();
      function endpoint(at) {
        const key = at.join(',');
        if (endpoints.has(key)) return;
        const first = endpoints.size === 0;
        endpoints.set(key, {
          kind: 'point',
          at,
          radius: first ? 3.4 : 2.8,
          color: first ? colors.path : colors.scene,
          outline: { color: first ? colors.scene : colors.path, width: 1.5 },
        });
      }
      for (const segment of trace) {
        const { mode, points, traversal, gait, requiredGait } = segment;
        const lengths = points
          .slice(1)
          .map((b, i) => Math.hypot(...b.map((value, axis) => value - points[i][axis])));
        const total = lengths.reduce((sum, length) => sum + length, 0);
        if (total === 0) continue;
        const walking = mode === 'walk' && !traversal;
        lines.push({
          kind: 'line',
          points,
          arrow: { color: '#fff' },
          stroke: {
            color: colors.path,
            width: walking ? 1.6 : 3,
            dash: walking ? [4, 3] : undefined,
          },
          outline: { color: colors.scene, width: walking ? 3 : 5, opacity: 0.9 },
        });
        endpoint(points[0]);
        endpoint(points.at(-1));
        let remaining = total / 2;
        const middle = lengths.findIndex((length) => {
          if (length > 0 && remaining <= length) return true;
          remaining -= length;
          return false;
        });
        const at = points[middle].map(
          (value, axis) =>
            value + (points[middle + 1][axis] - value) * (remaining / lengths[middle]),
        );
        const modeName = actionNames[mode] ?? mode;
        const gaitName = gaitNames[gait ?? requiredGait];
        const movement =
          traversal === 'moving-support'
            ? '乘平台'
            : gaitName
              ? walking
                ? gaitName
                : gaitName + modeName
              : modeName;
        const align = lines.length % 2 ? 'left' : 'right';
        labels.push({
          kind: 'label',
          at,
          align,
          offset: [align === 'left' ? 12 : -12, -4],
          text: `${lines.length} ${movement}`,
          color: colors.ink,
          halo: colors.scene,
        });
      }
      return [...lines, ...endpoints.values(), ...labels];
    }

    function localObjects(view) {
      const objects = [];
      if (settings.mesh) objects.push(view.mesh);
      if (settings.graph) {
        const palette = [colors.stroke, colors.start, colors.goal, colors.path];
        const byComponent = settings.components && view.hasComponents;
        for (const [from, to, kind] of view.edges) {
          const state = view.nodes[from][1] & view.nodes[to][1];
          const sameComponent = view.nodes[from][2] === view.nodes[to][2];
          const color = byComponent
            ? (sameComponent && view.componentColors[from]) || colors.dim
            : palette[state];
          objects.push({
            kind: 'line',
            points: [view.nodes[from][0], view.nodes[to][0]],
            stroke: {
              color,
              width: kind === 2 ? 1.1 : state ? 0.95 : 0.75,
              opacity: kind === 2 ? 0.18 : byComponent ? 0.36 : state ? 0.6 : 0.22,
              dash: kind === 2 ? [3, 3] : undefined,
            },
          });
        }
        view.nodes.forEach(([at, state], i) => {
          const opacity = byComponent || state ? 0.95 : 0.65;
          objects.push({
            kind: 'point',
            at,
            radius: 2.5,
            opacity,
            color: (byComponent && view.componentColors[i]) || palette[state],
            outline: { color: colors.scene, width: 0.7, opacity },
          });
        });
      }
      if (settings.trace) {
        const route = traceObjects(view.trace);
        objects.push(...route);
        const endpoints = new Set(
          route.filter((item) => item.kind === 'point').map((item) => item.at.join(',')),
        );
        for (const object of view.objects) {
          if (object.kind === 'label') {
            const label = marker(
              object.at,
              object.text,
              colors[object.tone ?? 'ink'],
              object.align,
            );
            if (endpoints.has(object.at.join(','))) {
              objects.push({
                ...label,
                marker: undefined,
                align: object.align,
                offset: [object.align === 'right' ? -9 : 9, -8],
              });
            } else {
              objects.push(label);
            }
          } else if (object.kind === 'line') {
            objects.push({
              kind: 'line',
              points: object.points,
              alwaysRender: object.alwaysRender,
              stroke: {
                color: colors[object.tone ?? 'path'],
                width: 2,
                dash: object.dashed ? [5, 5] : undefined,
              },
            });
          } else {
            const color = colors[object.tone ?? 'barrier'];
            objects.push({
              kind: 'mesh',
              faces: [object.points],
              clip: view.mesh.clip,
              material: { kind: 'flat', color, opacity: 0.46, outline: { color, width: 1.5 } },
            });
          }
        }
      }
      return objects;
    }

    for (const control of root.querySelectorAll('[data-layer]')) {
      control.addEventListener('change', () => {
        settings[control.dataset.layer] = control.checked;
        sceneObjects = undefined;
        updateColorControls();
        schedule();
      });
    }
    root.querySelector('[data-hide-occluded]').addEventListener('change', (event) => {
      renderer.state.occlusion = event.target.checked ? 'hide' : 'dash';
      motionSamples.length = 0;
      lastTimingUpdate = -Infinity;
      schedule();
    });
    topButton.addEventListener('click', () => {
      topView = !topView;
      [camera.yaw, camera.pitch] = topView
        ? [0, Math.PI / 2]
        : (views[selected].angle ?? fallbackAngle);
      topButton.setAttribute('aria-pressed', String(topView));
      schedule();
    });
    canvas.addEventListener('pointerdown', (event) => {
      if (!views[selected]) return;
      canvas.focus({ preventScroll: true });
      pointer = { id: event.pointerId, x: event.clientX, y: event.clientY };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove', (event) => {
      if (pointer?.id !== event.pointerId) return;
      camera.yaw -= (event.clientX - pointer.x) * 0.009;
      camera.pitch = Math.max(
        -0.4,
        Math.min(Math.PI / 2, camera.pitch + (event.clientY - pointer.y) * 0.009),
      );
      pointer = { id: event.pointerId, x: event.clientX, y: event.clientY };
      topView = false;
      topButton.setAttribute('aria-pressed', 'false');
      schedule();
    });
    canvas.addEventListener('lostpointercapture', () => {
      pointer = undefined;
      schedule();
    });
    canvas.addEventListener(
      'wheel',
      (event) => {
        if (!views[selected]) return;
        event.preventDefault();
        changeArmLength(Math.exp(event.deltaY * 0.002));
        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => {
          wheelTimer = undefined;
          schedule();
        }, 120);
        schedule();
      },
      { passive: false },
    );
    function stopMoving() {
      heldKeys.clear();
      previousFrame = undefined;
    }
    canvas.addEventListener('keydown', (event) => {
      if (
        !views[selected] ||
        !movementKeys.has(event.code) ||
        event.altKey ||
        event.ctrlKey ||
        event.metaKey
      )
        return;
      event.preventDefault();
      if (!heldKeys.size) previousFrame = performance.now();
      heldKeys.add(event.code);
      schedule();
    });
    canvas.addEventListener('keyup', (event) => {
      if (!heldKeys.delete(event.code)) return;
      event.preventDefault();
      if (!heldKeys.size) previousFrame = undefined;
    });
    canvas.addEventListener('blur', stopMoving);
    window.addEventListener('blur', stopMoving);
    new ResizeObserver(schedule).observe(canvas);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', schedule);
    select(0);
  })();
</script>

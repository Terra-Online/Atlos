name: Build

on:
  push:
    branches:
      - main
      - master
      # - 'feature/*'        # 匹配所有 feature/ 开头的分支
      # - 'hotfix/*'         # 匹配所有 hotfix/ 开头的分支
      - "release/*" # 匹配所有 release/ 开头的分支
      - "v*" # 匹配所有 v 开头的版本分支
  pull_request:
    branches:
      - main
      - master
      # - 'feature/*'
      # - 'hotfix/*'
      - "release/*"
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: python -m pip install fonttools brotli

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Generate build configs
        run: |
          cp config/config.template.json config/config.json
          cp config/config.r2.template.json config/config.r2.json
        working-directory: ./talos

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./talos

      # Private map/font/icon assets are deliberately absent from the public checkout.
      # This compiles all applications and targets but does not produce a release artifact.
      - name: Check and build both site targets
        run: pnpm check --build --source-only --skip-subset
        working-directory: ./talos

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-builds
          path: |
            talos/dist/oss/
            talos/dist/r2/
          include-hidden-files: true
          retention-days: 7
